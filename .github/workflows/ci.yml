name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run exactly these checks before it builds anything.
  workflow_call:

permissions:
  contents: read

# The event name keeps a release run's CI (called via workflow_call, which
# reports the caller's event) from cancelling, or being cancelled by, a push
# run on the same ref.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, test, conformance)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Tauri + Manifold build)
        # libdbus-1-dev: the keyring crate's Secret Service backend.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Conformance corpus
        run: cargo run -p morphe-conformance --locked

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

      - name: Build (includes tsc)
        run: bun run build
