name: Release

# Builds the morphe desktop app for macOS, Linux and Windows and attaches the
# installers to a DRAFT GitHub release. Nothing is published automatically:
# review the draft, then publish it by hand.
#
# Signing is optional. Without the secrets below the workflow still produces
# working, unsigned artifacts:
#
#   macOS code signing and notarization
#     APPLE_CERTIFICATE           base64-encoded .p12 (Developer ID Application)
#     APPLE_CERTIFICATE_PASSWORD  password of that .p12
#     APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#     APPLE_ID, APPLE_PASSWORD    Apple ID + app-specific password (notarization)
#     APPLE_TEAM_ID               10-character team ID
#   and the repository VARIABLE (not secret) MACOS_SIGNING = true.
#
#   Tauri updater signatures (only used once the updater plugin is configured)
#     TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Why the MACOS_SIGNING variable: GitHub Actions cannot leave an env var unset
# when its secret is missing, it sets it to "". The Tauri bundler treats a
# present-but-empty APPLE_CERTIFICATE as a certificate to import and fails,
# so the Apple secrets are only handed to the build when the variable says
# they exist. (Secrets themselves cannot be tested in a step `if:`.) The
# updater keys are only read when `createUpdaterArtifacts` is enabled, so
# passing them empty is harmless.
#
# Third-party actions are pinned to a version tag. For a hardened supply
# chain, pin each one to a full commit SHA (with the tag in a comment) and let
# Dependabot or Renovate bump them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The exact checks every PR runs: fmt, clippy, tests, conformance corpus and
  # the frontend build.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The bundles are versioned from tauri.conf.json, so a tag that
      # disagrees with it would ship mislabelled installers.
      - name: Check tag matches app version
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          expected="v${version}"
          if [ "$EVENT" = "push" ] && [ "$REF_NAME" != "$expected" ]; then
            echo "::error::tag $REF_NAME does not match tauri.conf.json version $version (expected $expected)"
            exit 1
          fi
          echo "tag=${expected}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [ci, preflight]
    # Read-only token: the jobs that hold signing secrets cannot write to the
    # repository. Only the release job below can.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two native macOS builds instead of one universal binary: the
          # Manifold C++ library is built by manifold-csg-sys with a plain
          # cmake call that does not set CMAKE_OSX_ARCHITECTURES, so a
          # cross-compiled slice would link host-arch objects.
          - name: macOS (Apple Silicon)
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS (Intel)
            # macos-15-intel is GitHub's last Intel macOS image.
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux
            # Built on the oldest supported Ubuntu so the AppImage and .deb
            # run on as many glibc versions as possible.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # cmake (for Manifold) is preinstalled on the GitHub macOS and Windows
      # images, as are Xcode and Visual Studio 2022 with the C++ workload.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        # Same packages as ci.yml, plus what the AppImage/deb bundlers call
        # out to (file, patchelf, xdg-utils).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
            file patchelf xdg-utils

      # rust-toolchain.toml pins the toolchain; install it (and the target,
      # which is the host triple on every runner here) explicitly so the
      # build step does not depend on rustup's auto-install behaviour.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version && cargo --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      # Deliberately no build cache: release artifacts are built from a clean
      # tree so a poisoned cache entry cannot end up in a signed binary.

      - name: Build (signed macOS)
        id: build-signed
        if: runner.os == 'macOS' && vars.MACOS_SIGNING == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Every other case: Linux, Windows, and macOS without signing set up.
      # Without tagName/releaseId the action only builds; the release job
      # does the uploading.
      - name: Build
        id: build
        if: ${{ !(runner.os == 'macOS' && vars.MACOS_SIGNING == 'true') }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Cargo puts bundles in the workspace target dir at the repository root.
      - uses: actions/upload-artifact@v6
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig

  release:
    name: Create draft release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    # The only job allowed to write: it creates the draft and uploads assets.
    # It never sees a signing secret.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          path: artifacts

      # Each artifact keeps its bundle/<kind>/ layout; flatten it into one
      # directory of release assets, refusing to overwrite on a name clash.
      - name: Collect assets and checksums
        run: |
          mkdir dist
          find artifacts -type f -print0 | while IFS= read -r -d '' f; do
            name="$(basename "$f")"
            if [ -e "dist/$name" ]; then
              echo "::error::duplicate asset name $name"
              exit 1
            fi
            mv "$f" "dist/$name"
          done
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      # A draft does not create the tag until it is published; --target pins
      # it to the commit that was built (ignored when the tag already exists).
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --draft \
            --title "morphe $TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
